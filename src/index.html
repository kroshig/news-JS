<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>News Portal</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header class="header">
            <div class="header__container">
                <h1 class="header__title">News Portal</h1>
                <p class="header__subtitle">Global headlines &amp; breaking stories in real time</p>
            </div>
        </header>

        <main class="main">
            <section class="sources-section">
                <h2 class="sources-section__title">Choose a News Source</h2>
                <div class="sources buttons"></div>
            </section>

            <div class="news">
                <div class="news__placeholder">
                    <p class="news__placeholder-title">Select a source above to start reading</p>
                    <p class="news__placeholder-text">
                        Click on any news agency button in the list to load its latest articles.
                    </p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer__container">
                <a
                    class="footer__github"
                    href="https://github.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    GitHub
                </a>

                <p class="copyright">
                    2026 | Powered by <a href="https://newsapi.org" target="_blank" rel="noopener noreferrer">NewsAPI</a>
                </p>

                <a
                    class="footer__rss-link"
                    href="https://rs.school/courses/javascript-ru"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="RS School Course"
                >
                    <svg class="footer__rss-logo" viewBox="0 0 240 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="240" height="90" rx="14" fill="#F8FAFC" />
                        <text
                            x="50%"
                            y="56%"
                            dominant-baseline="middle"
                            text-anchor="middle"
                            fill="#0F172A"
                            font-family="Inter, sans-serif"
                            font-weight="800"
                            font-size="34"
                            letter-spacing="1"
                        >
                            RS SCHOOL
                        </text>
                    </svg>
                </a>
            </div>
        </footer>

        <template id="sourceItemTemp">
            <div class="source__item">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#" target="_blank" rel="noopener noreferrer">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
